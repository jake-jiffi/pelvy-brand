<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <title>Pelvy app, a program</title>
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,500;7..72,600&family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@500&display=swap">
  <style>
    /*
      Pelvy app: one program, Pelvic floor strength.
      Drawn from the next version shown in Pelvy's March 2026 demo; the numbers are the program's own defaults.
      Type:      Literata title, DM Sans labels, DM Mono for every count.
      Colour:    Paper ground, white cards. Deep sage on the one action, Start exercises.
      Signature: The count ring numbers the three parts of the program, which really are done in order.
    */
    :root {
      --deep: #41684A;
      --paper: #F8F9F8;
      --white: #FFFFFF;
      --ink: #263529;
      --muted: #6B726D;
      --line: #DADDDA;
      --accent: #5E6687;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    .app { width: 390px; height: 844px; overflow: hidden; background: var(--paper); color: var(--ink); font-family: 'DM Sans', 'Trebuchet MS', sans-serif; display: flex; flex-direction: column; }
    .app h1, .app h2, .app p, .app dl, .app dt, .app dd { margin: 0; }
    .iconbtn { width: 44px; height: 44px; border: 0; background: transparent; color: var(--ink); display: flex; align-items: center; justify-content: center; padding: 0; }
    .card { background: var(--white); border: 1px solid var(--line); border-radius: 22px; padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; }
    .ring { width: 34px; height: 34px; border-radius: 999px; border: 3px solid var(--deep); display: flex; align-items: center; justify-content: center; font-family: 'DM Mono', 'Courier New', monospace; font-weight: 500; font-size: 17px; line-height: 1; flex: none; }
    .stats { display: flex; gap: 28px; }
    .stats dt { font-size: 13px; color: var(--muted); }
    .stats dd { font-family: 'DM Mono', 'Courier New', monospace; font-weight: 500; font-size: 20px; line-height: 1.2; }
    .rest { font-size: 14px; color: var(--muted); padding: 0 18px; }
  </style>
</helmet>
<div class="app">
  <div style="padding: 54px 8px 8px 8px; display: flex; align-items: center; gap: 2px;">
    <button class="iconbtn" aria-label="Back to programs">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg>
    </button>
    <h1 style="font-family: 'Literata', Georgia, serif; font-size: 22px; font-weight: 600; flex: 1;">Pelvic floor strength</h1>
    <button class="iconbtn" aria-label="Edit program">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="m13 7 4 4"/></svg>
    </button>
    <button class="iconbtn" aria-label="Set reminders">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 17V11a6 6 0 0 1 12 0v6l2 2H4z"/><path d="M10 21h4"/></svg>
    </button>
  </div>

  <div style="flex: 1; padding: 8px 16px 0 16px; display: flex; flex-direction: column; gap: 10px;">
    <div class="card">
      <div style="display: flex; align-items: center; gap: 12px;"><span class="ring">1</span><h2 style="font-size: 18px; font-weight: 600;">Quick squeezes</h2></div>
      <dl class="stats"><div><dt>Hold</dt><dd>2s</dd></div><div><dt>Rest</dt><dd>3s</dd></div><div><dt>Reps</dt><dd>10</dd></div></dl>
    </div>
    <p class="rest">Rest for 10 seconds</p>
    <div class="card">
      <div style="display: flex; align-items: center; gap: 12px;"><span class="ring">2</span><h2 style="font-size: 18px; font-weight: 600;">Holds</h2></div>
      <dl class="stats"><div><dt>Hold</dt><dd>5s</dd></div><div><dt>Rest</dt><dd>5s</dd></div><div><dt>Reps</dt><dd>10</dd></div></dl>
    </div>
    <p class="rest">Rest for 10 seconds</p>
    <div class="card">
      <div style="display: flex; align-items: center; gap: 12px;"><span class="ring">3</span><h2 style="font-size: 18px; font-weight: 600;">Belly breathing</h2></div>
      <dl class="stats"><div><dt>In</dt><dd>3s</dd></div><div><dt>Hold</dt><dd>2s</dd></div><div><dt>Out</dt><dd>4s</dd></div><div><dt>Reps</dt><dd>10</dd></div></dl>
    </div>
    <p style="font-size: 14px; color: var(--muted); padding: 4px 18px 0 18px;">3 times daily. Reminders at 8am, 2pm and 8pm.</p>
  </div>

  <div style="padding: 16px 20px 44px 20px;">
    <button style="width: 100%; height: 56px; border: 0; border-radius: 999px; background: var(--deep); color: var(--white); font-family: inherit; font-size: 17px; font-weight: 600;">Start exercises</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
}
</script>
</body>
</html>
