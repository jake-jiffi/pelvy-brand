<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <title>Pelvy app, breathing in</title>
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,500;7..72,600&family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@500&display=swap">
  <style>
    /*
      Pelvy app: the exercise player, breathing in.
      Drawn from the next version shown in Pelvy's March 2026 demo, which marks the three states in green, orange and blue.
      Here: sage means let go (breathe in), slate means work (breathe out, squeeze), and a ring means hold.
      Each state also differs in lightness and carries its word, so it does not depend on hue.
      Type:      Literata for the cue, DM Mono for the count, DM Sans for controls.
      Colour:    Paper ground. A filled sage disc with ink type at display size. No slate on this screen.
    */
    :root {
      --deep: #41684A;
      --sage: #78A080;
      --paper: #F8F9F8;
      --white: #FFFFFF;
      --ink: #263529;
      --muted: #6B726D;
      --accent: #5E6687;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    .app { width: 390px; height: 844px; overflow: hidden; background: var(--paper); color: var(--ink); font-family: 'DM Sans', 'Trebuchet MS', sans-serif; display: flex; flex-direction: column; }
    .app h1, .app p { margin: 0; }
    .iconbtn { width: 44px; height: 44px; border: 0; background: transparent; color: var(--ink); display: flex; align-items: center; justify-content: center; padding: 0; }
    .mono { font-family: 'DM Mono', 'Courier New', monospace; font-weight: 500; }
  </style>
</helmet>
<div class="app">
  <div style="padding: 54px 8px 8px 8px; display: flex; align-items: center; gap: 4px;">
    <button class="iconbtn" aria-label="Close exercise">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
    <h1 style="font-size: 18px; font-weight: 600;">Belly breathing</h1>
  </div>

  <div style="flex: 1; display: flex; flex-direction: column; align-items: center; padding: 28px 28px 0 28px;">
    <p class="mono" style="font-size: 16px; color: var(--muted);">Rep 1 of 20</p>
    <p style="font-family: 'Literata', Georgia, serif; font-size: 30px; line-height: 1.2; font-weight: 600; color: var(--deep); text-align: center; margin-top: 40px; max-width: 310px;">Widen your lower belly, waist and ribs</p>
    <div style="flex: 1; display: flex; align-items: center; justify-content: center;">
      <div style="border-radius: 999px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; width: 264px; height: 264px; padding: 24px; background: var(--sage);">
        <span class="mono" style="font-size: 84px; line-height: 1;">3</span>
        <span style="font-size: 24px; font-weight: 600;">Breathe in</span>
      </div>
    </div>
  </div>

  <div style="padding: 20px 28px 48px 28px; display: flex; justify-content: center;">
    <button style="height: 56px; padding: 0 30px; border-radius: 999px; background: transparent; color: var(--ink); border: 2px solid var(--ink); font-family: inherit; font-size: 17px; font-weight: 600; display: flex; align-items: center; gap: 10px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M9 5v14M15 5v14"/></svg>
      Pause
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
}
</script>
</body>
</html>
